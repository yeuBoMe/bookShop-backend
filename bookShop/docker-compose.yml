version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: book_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sunhouse1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./book_shop.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookshop:
