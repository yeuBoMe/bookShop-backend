spring.application.name=BookShop
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gom nhieu INSERT/UPDATE vao mot lan gui xuong DB (dung cho luong import file).
spring.jpa.properties.hibernate.jdbc.batch_size=${JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Optimizer pooled mac dinh coi gia tri nextval la CAN TREN cua khoi id.
# Sequence moi bat dau tu 1, increment 50 => khoi dau tien la -48..1 => id AM tren DB trang.
# pooled-lo coi gia tri do la CAN DUOI nen khoi dau la 1..50, dung tren ca DB moi lan DB cu.
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo

# Nap gop cac quan he lazy con sot lai theo lo thay vi tung ban ghi mot.
spring.jpa.properties.hibernate.default_batch_fetch_size=${JPA_FETCH_SIZE:50}

# Tat Open-Session-In-View: khong de tang view am tham ban them query,
# moi truy van phai nam trong service va nhin thay duoc.
spring.jpa.open-in-view=false

# config jwt
bookshop.jwt.base64-secret=${SECRET_KEY}

# expiration
bookshop.jwt.access-token-validity-in-seconds=${JWT_EXPIRATION}
bookshop.jwt.refresh-token-validity-in-seconds=${JWT_EXPIRATION}

# config multipart file
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# domain url
bookshop.frontend.url=${BOOKSHOP_FRONTEND_URL}
bookshop.backend.url=${BOOKSHOP_BACKEND_URL}

# base path
bookshop.upload-file.base-uri=${BOOKSHOP_UPLOAD_FILE_BASE_URI}

# config page number start = 1
spring.data.web.pageable.one-indexed-parameters=true

# config sending email with Gmail
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth= true
spring.mail.properties.mail.smtp.starttls.enable= true
spring.mail.test-connection=true

# config cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

# config login gg
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}

# config chatbot
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.base-url=${SPRING_AI_OPENAI_CHAT_BASE_URL}
spring.ai.openai.chat.completions-path=${SPRING_AI_OPENAI_CHAT_COMPLETIONS_PATH}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL}

# log spring
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.web=DEBUG

# Phi van chuyen - phai khop quy tac dang dung o FE (cart.service.ts)
bookshop.order.free-shipping-threshold=${ORDER_FREE_SHIPPING_THRESHOLD:150000}
bookshop.order.shipping-fee=${ORDER_SHIPPING_FEE:30000}

# Import chia lo: moi lo mot transaction rieng
bookshop.import.chunk-size=${IMPORT_CHUNK_SIZE:100}

# Man hinh thong ke
bookshop.dashboard.default-range-days=${DASHBOARD_RANGE_DAYS:30}
bookshop.dashboard.top-limit=${DASHBOARD_TOP_LIMIT:10}
bookshop.dashboard.low-stock-threshold=${DASHBOARD_LOW_STOCK_THRESHOLD:5}

# Cache so lieu thong ke - doc nhieu ghi it. Tat bang CACHE_ENABLED=false khi can so tuoi.
bookshop.cache.enabled=${CACHE_ENABLED:true}
bookshop.cache.max-entries=${CACHE_MAX_ENTRIES:500}
bookshop.cache.dashboard-revenue-seconds=${CACHE_DASHBOARD_REVENUE_SECONDS:60}
bookshop.cache.dashboard-ranking-seconds=${CACHE_DASHBOARD_RANKING_SECONDS:300}
bookshop.cache.dashboard-low-stock-seconds=${CACHE_DASHBOARD_LOW_STOCK_SECONDS:120}

# Tim kiem theo con tro
bookshop.search.default-size=${SEARCH_DEFAULT_SIZE:20}
bookshop.search.max-size=${SEARCH_MAX_SIZE:100}

# Xuat du lieu ra CSV theo luong
bookshop.export.chunk-size=${EXPORT_CHUNK_SIZE:500}
bookshop.export.max-rows=${EXPORT_MAX_ROWS:100000}
bookshop.export.csv-separator=${EXPORT_CSV_SEPARATOR:,}
