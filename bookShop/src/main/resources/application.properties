spring.application.name=BookShop
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.show-sql=true

# config jwt
bookshop.jwt.base64-secret=${SECRET_KEY}

# expiration
bookshop.jwt.access-token-validity-in-seconds=${JWT_EXPIRATION}
bookshop.jwt.refresh-token-validity-in-seconds=${JWT_EXPIRATION}

# config multipart file
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# domain url
bookshop.frontend.url=${BOOKSHOP_FRONTEND_URL}
bookshop.backend.url=${BOOKSHOP_BACKEND_URL}

# base path
bookshop.upload-file.base-uri=${BOOKSHOP_UPLOAD_FILE_BASE_URI}

# config page number start = 1
spring.data.web.pageable.one-indexed-parameters=true

# config sending email with Gmail
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth= true
spring.mail.properties.mail.smtp.starttls.enable= true
spring.mail.test-connection=true

# config cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

# config login gg
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}

# config chatbot
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
#spring.ai.openai.chat.base-url=${SPRING_AI_OPENAI_CHAT_BASE_URL}
#spring.ai.openai.chat.completions-path=${SPRING_AI_OPENAI_CHAT_COMPLETIONS_PATH}
#spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL}

