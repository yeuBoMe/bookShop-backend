# Cau hinh danh rieng cho self-test: H2 in-memory, khong cham DB/SMTP/cloud that
#
# Moi Spring context mot database rieng (ten co uuid). Dung chung mot database thi
# context moi chay create-drop lam sequence quay ve 1, trong khi context cu van giu
# khoi id da cap phat -> trung khoa chinh o cac lop test chay sau.
spring.datasource.url=jdbc:h2:mem:bookshop-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

bookshop.jwt.base64-secret=v4/bB/zwTlrv1vxP4hqd+sj/4tW2gm1RuuAUyC8Eczjdz7QNHuz6fBDunHWLdICjvOx7gHfVzcfXGyA8oWBKaQ==
bookshop.jwt.access-token-validity-in-seconds=3600
bookshop.jwt.refresh-token-validity-in-seconds=7200

bookshop.frontend.url=http://localhost:5173
bookshop.backend.url=http://localhost:8080
bookshop.upload-file.base-uri=file:///${java.io.tmpdir}/bookshop-test-upload/

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.test-connection=false

cloudinary.name=test-cloud
cloudinary.api.key=test-key
cloudinary.api.secret=test-secret

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

spring.ai.openai.api-key=test-openai-key

spring.data.web.pageable.one-indexed-parameters=true
logging.level.root=WARN

spring.jpa.properties.hibernate.generate_statistics=true

bookshop.cache.enabled=false
